version: "2"
linters:
  enable:
    - gosec
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: (.+)_test\.go
  settings:
    govet:
      enable-all: true
      disable:
        - buildtag
        - fieldalignment
run:
  timeout: 5m