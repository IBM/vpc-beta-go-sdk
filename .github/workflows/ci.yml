name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: 'v2.6.2'
  GOLANGCI_LINT_MODULE: 'github.com/golangci/golangci-lint/v2/cmd/golangci-lint'

jobs:
  test:
    name: Test Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.24.x', '1.25.x', '1.26.x']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Tidy
      run: make tidy

    - name: Build
      run: make build

    - name: Unit tests
      run: make test-unit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'

    - name: Install golangci-lint
      run: go install ${{ env.GOLANGCI_LINT_MODULE }}@${{ env.GOLANGCI_LINT_VERSION }}

    - name: Run lint
      run: make lint
